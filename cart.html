<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#062f57"
  >

  <title>
    カート｜MARINK
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

<header class="app-header">

  <a href="index.html"
     class="header-logo-link"
     aria-label="MARINK ホーム">

    <img src="images/marink-logo-wide.png"
         alt="MARINK"
         class="header-logo">

  </a>

  <div class="header-actions">

    <a href="cart.html"
       class="header-cart-button active"
       aria-label="カートを見る">

      <svg viewBox="0 0 24 24"
           aria-hidden="true">

        <path
          d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L20.5 8H7"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round">
        </path>

        <circle cx="10" cy="19" r="1.2"
                fill="currentColor"></circle>

        <circle cx="17" cy="19" r="1.2"
                fill="currentColor"></circle>

      </svg>

      <span class="cart-count-badge"></span>

    </a>

  </div>

</header>

<main class="app-main">

<section class="shop-page-header">

      <span
        class="section-label"
      >
        CART
      </span>

      <h1>
        カート
      </h1>

      <p>
        選択した商品を確認できます。
      </p>

    </section>



    <section
      class="cart-page"
    >

      <div
        id="cartList"
      ></div>


      <div
        class="cart-summary"
        id="cartSummary"
      ></div>

    </section>



    <section
      class="app-section"
    >

      <a
        href="acrylic-keyholders.html"
        class="shop-back-button"
      >

        ← 商品一覧へ戻る

      </a>

    </section>


  </main>



  <script
    src="cart-utils.js"
  ></script>

  <script
    src="cart.js"
  ></script>


</body>

</html>

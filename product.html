<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#062f57"
  >

  <title>
    MARINK PRODUCT
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<header class="app-header">

  <a
    href="index.html"
    class="header-logo-link"
  >

    <img
      src="images/marink-logo-wide.png"
      alt="MARINK"
      class="header-logo"
    >

  </a>


  <div class="header-actions">

    <a
      href="cart.html"
      class="header-cart-button"
      aria-label="カートを見る"
    >

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <path
          d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L20.5 8H7"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></path>

        <circle
          cx="10"
          cy="19"
          r="1.2"
          fill="currentColor"
        ></circle>

        <circle
          cx="17"
          cy="19"
          r="1.2"
          fill="currentColor"
        ></circle>

      </svg>


      <span
        class="cart-count-badge"
      ></span>

    </a>

  </div>

</header>




  <main class="app-main">


    <section
      class="product-detail"
      id="productDetail"
    ></section>


  </main>



 <script
  src="acrylic-keyholders-data.js"
></script>

<script
  src="cart-utils.js"
></script>

<script
  src="product-detail.js"
></script>




</body>

</html>

<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#062f57"
  >

  <title>
    カート｜MARINK
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  class="header-cart-button active"

    <a
      href="index.html"
      class="header-logo-link"
    >

      <img
        src="images/marink-logo-wide.png"
        alt="MARINK"
        class="header-logo"
      >

    </a>

  </header>



  <main class="app-main">


    <section
      class="shop-page-header"
    >

      <span
        class="section-label"
      >
        CART
      </span>

      <h1>
        カート
      </h1>

      <p>
        選択した商品を確認できます。
      </p>

    </section>



    <section
      class="cart-page"
    >

      <div
        id="cartList"
      ></div>


      <div
        class="cart-summary"
        id="cartSummary"
      ></div>

    </section>



    <section
      class="app-section"
    >

      <a
        href="acrylic-keyholders.html"
        class="shop-back-button"
      >

        ← 商品一覧へ戻る

      </a>

    </section>


  </main>



  <script
    src="cart-utils.js"
  ></script>

  <script
    src="cart.js"
  ></script>


</body>

</html>
